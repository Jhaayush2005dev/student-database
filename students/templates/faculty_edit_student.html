{% extends 'base.html' %}

{% block content %}
<div class="card shadow p-4 bg-white rounded">
    <h3 class="fw-bold mb-3">Edit Student</h3>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'faculty_student_profile' student.pk %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
