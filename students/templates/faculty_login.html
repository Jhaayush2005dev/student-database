{% extends 'base.html' %}

{% block login_content %}
<div class="card shadow p-4 mt-5">
    <h3 class="mb-4 text-center">Faculty Login</h3>
    {% if form.errors %}
        <div class="alert alert-danger">Please enter a valid username and password.</div>
    {% endif %}
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_username" class="form-label">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="mt-3 text-center">
        <a href="{% url 'signup' %}">Create new account</a><br>
        <a href="{% url 'admin_login' %}">Admin Login</a> |
        <a href="{% url 'student_login' %}">Student Login</a>
    </div>
</div>
{% endblock %}
