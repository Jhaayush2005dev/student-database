{% extends 'base.html' %}
{% block content %}
<div class="card shadow p-4 bg-white rounded">
    <div class="d-flex align-items-center gap-3 mb-4">
        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 60px; height: 60px; font-size: 24px;">
            <i class="bi bi-person"></i>
        </div>
        <div>
            <h3 class="m-0 fw-bold">{{ username }}</h3>
            <span class="badge bg-secondary text-uppercase">{{ role }} Account</span>
        </div>
    </div>
    <hr>
    <div class="row g-3">
        <div class="col-md-6">
            <label class="text-muted small">Username</label>
            <p class="fs-5 fw-semibold">{{ username }}</p>
        </div>
        <div class="col-md-6">
            <label class="text-muted small">Email Address</label>
            <p class="fs-5 fw-semibold">{% if email %}{{ email }}{% else %}{{ username }}@erp.com{% endif %}</p>
        </div>
    </div>
</div>
{% endblock %}
